name: Build Other Docker image
on:
  workflow_dispatch:
    inputs:
      build_version:
        description: "1、请选择构建版本"
        required: true
        default: 'lede-25.12'
        type: choice
        options:
          - 'lede-25.12'
          - 'openwrt-25.12'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v6

    - name: 🔍 解析版本
      id: version
      run: |
        SOURCE=$(echo "${{ inputs.build_version }}" | cut -d'-' -f1)
        BRANCH=$(echo "${{ inputs.build_version }}" | cut -d'-' -f2)
        echo "source=${SOURCE}" >> $GITHUB_OUTPUT
        echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
        echo "✅ 源: ${SOURCE}, 分支: ${BRANCH}"

    - name: 📦 安装依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y curl gzip

    - name: ⏬ 下载 Rootfs
      id: download
      run: |
        SOURCE="${{ steps.version.outputs.source }}"
        if [[ "${SOURCE}" == "lede" ]]; then
          DOWNLOAD_URL="https://github.com/Kwonelee/LEDE-Native/releases/download/LEDE-ImageBuilde/openwrt-armsr-armv8-generic-rootfs.tar.gz"
          else
          DOWNLOAD_URL="https://github.com/sbwml/builder/releases/download/v25.12.5-minimal/openwrt-25.12.5-armsr-armv8-generic-rootfs.tar.gz"
        fi
        echo "✅ 下载地址: ${DOWNLOAD_URL}"
        curl -L -o generic-rootfs.tar.gz "${DOWNLOAD_URL}"

    - name: 🐳 构建 Docker 镜像
      id: docker_build
      run: |
        # 查找 rootfs 文件
        ROOTFS_FILE="generic-rootfs.tar.gz"
        
        # 生成镜像标签
        IMAGE_TAG="${{ steps.version.outputs.branch }}"
        DOCKER_IMAGE="${{ steps.version.outputs.source }}:${IMAGE_TAG}"
        
        # 直接从 rootfs.tar.gz 导入 Docker 镜像（指定 arm64 平台）
        gunzip -c "$ROOTFS_FILE" | docker import --platform linux/arm64 - ${DOCKER_IMAGE}
        
        # 导出 Docker 镜像（未压缩）
        docker save ${DOCKER_IMAGE} > ${{ inputs.build_version }}.tar
        
        # 保存文件名供后续使用
        echo "docker_file=${{ inputs.build_version }}.tar" >> $GITHUB_OUTPUT

    - name: 🚀 发布 Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: OpenWrt_docker_image
        body: |
          🐳 介绍： Build OpenWrt Docker image
          
          🖥️ 平台： arm64
          
          👤 用户名： root
          
          🔒 密码： 无
          
          🌐 IP： 动态获取（从上级路由找寻）
        files: |
          ${{ steps.docker_build.outputs.docker_file }}
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
